<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamNest - Stream Anything, Anywhere</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#E50914',
                            dark: '#b20710',
                        },
                        dark: {
                            DEFAULT: '#0f0f13',
                            card: '#1a1a24',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            overflow-x: hidden;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass {
            background: rgba(26, 26, 36, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .netflix-hover {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s, box-shadow 0.3s;
        }
        
        .netflix-hover:hover {
            transform: scale(1.05) translateY(-5px);
            z-index: 50;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .hero-gradient {
            background: linear-gradient(to top, #0f0f13 0%, transparent 60%),
                        linear-gradient(to right, #0f0f13 0%, transparent 60%);
        }

        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toast-enter { animation: slideInRight 0.3s forwards; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .skeleton {
            background: linear-gradient(90deg, #1a1a24 25%, #2a2a35 50%, #1a1a24 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <!-- Desktop Sidebar -->
    <nav class="hidden md:flex flex-col w-64 glass h-screen fixed left-0 top-0 z-40 px-6 py-8">
        <div class="flex items-center gap-3 mb-12 cursor-pointer" onclick="app.navigate('home')">
            <div class="w-10 h-10 rounded-lg bg-brand flex items-center justify-center text-xl font-bold shadow-lg shadow-brand/30">
                <i class="fas fa-play"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wider">StreamNest</h1>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest">Stream Anything</p>
            </div>
        </div>

        <div class="flex-1 space-y-6">
            <div>
                <p class="text-xs text-gray-500 font-semibold mb-3 uppercase">Menu</p>
                <div class="space-y-1">
                    <button onclick="app.navigate('home')" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium">
                        <i class="fas fa-home w-5"></i> Home
                    </button>
                    <button class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium">
                        <i class="fas fa-compass w-5"></i> Discover
                    </button>
                </div>
            </div>

            <div id="admin-menu-section" class="hidden">
                <p class="text-xs text-brand font-semibold mb-3 uppercase">Admin Panel</p>
                <div class="space-y-1">
                    <button onclick="app.navigate('admin')" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl bg-brand/10 text-brand hover:bg-brand/20 transition-all text-sm font-medium border border-brand/20">
                        <i class="fas fa-cog w-5"></i> Dashboard
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-auto border-t border-white/10 pt-6">
            <div id="auth-section"></div>
        </div>
    </nav>

    <!-- Mobile Topbar -->
    <div class="md:hidden glass w-full fixed top-0 z-40 px-5 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2 cursor-pointer" onclick="app.navigate('home')">
            <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center text-sm font-bold">
                <i class="fas fa-play"></i>
            </div>
            <h1 class="text-lg font-bold">StreamNest</h1>
        </div>
        <div id="mobile-auth-btn"></div>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="md:hidden glass w-full fixed bottom-0 z-40 flex justify-around items-center py-3 px-2 border-t border-white/5 pb-safe">
        <button onclick="app.navigate('home')" class="flex flex-col items-center p-2 text-gray-400">
            <i class="fas fa-home text-lg mb-1"></i>
            <span class="text-[10px]">Home</span>
        </button>
        <button id="mobile-admin-btn" onclick="app.navigate('admin')" class="hidden flex-col items-center p-2 text-brand">
            <i class="fas fa-shield-alt text-lg mb-1"></i>
            <span class="text-[10px]">Admin</span>
        </button>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 md:ml-64 w-full min-h-screen relative pb-20 md:pb-0 pt-16 md:pt-0 overflow-x-hidden">
        
        <!-- VIEW: HOME -->
        <section id="view-home" class="view-section w-full min-h-screen">
            <!-- Hero / Banner Slider -->
            <div id="hero-container" class="w-full h-[60vh] md:h-[80vh] relative bg-dark-card skeleton overflow-hidden">
                <!-- Injected via JS -->
            </div>

            <div class="px-5 md:px-10 py-8 space-y-12 -mt-20 relative z-20">
                <div class="relative max-w-md glass rounded-full overflow-hidden flex items-center px-4 py-2">
                    <i class="fas fa-search text-gray-400"></i>
                    <input type="text" id="search-input" placeholder="Search movies, anime..." class="bg-transparent border-none outline-none text-sm px-3 py-2 w-full text-white">
                </div>

                <!-- Video Rows -->
                <div>
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold border-l-4 border-brand pl-3">Semua Koleksi</h2>
                    </div>
                    <div id="main-row" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
                        <!-- Konten Otomatis dari Firebase -->
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW: DETAIL & PLAYER -->
        <section id="view-detail" class="view-section hidden w-full min-h-screen fade-in">
            <div class="w-full aspect-video bg-black relative" id="player-container">
                <iframe id="main-player" class="w-full h-full border-none" allowfullscreen allow="autoplay; fullscreen"></iframe>
            </div>

            <div class="px-5 md:px-10 py-8 max-w-6xl mx-auto">
                <div class="flex flex-col md:flex-row gap-8">
                    <div class="hidden md:block w-1/4">
                        <img id="detail-thumb" src="" alt="Thumbnail" class="w-full rounded-xl shadow-2xl">
                    </div>
                    <div class="w-full md:w-3/4 space-y-4">
                        <div class="flex gap-2 text-xs font-semibold tracking-wider uppercase text-gray-400" id="detail-meta"></div>
                        <h1 id="detail-title" class="text-3xl md:text-5xl font-bold uppercase tracking-tight"></h1>
                        <p id="detail-desc" class="text-gray-300 leading-relaxed max-w-3xl"></p>
                        <div class="flex gap-4 pt-4">
                            <button onclick="document.getElementById('player-container').scrollIntoView({behavior: 'smooth'})" class="bg-brand hover:bg-brand-dark text-white px-8 py-3 rounded-full font-bold flex items-center gap-2 transition-all">
                                <i class="fas fa-play"></i> Mulai Menonton
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW: ADMIN PANEL -->
        <section id="view-admin" class="view-section hidden w-full min-h-screen p-5 md:p-10 fade-in">
            <div class="max-w-6xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                    <div>
                        <h2 class="text-3xl font-bold">Admin Dashboard</h2>
                        <p class="text-gray-400">Kelola database video secara real-time.</p>
                    </div>
                    <button onclick="app.openModal('video-modal')" class="bg-brand hover:bg-brand-dark px-5 py-2.5 rounded-lg font-medium flex items-center gap-2">
                        <i class="fas fa-plus"></i> Tambah Video Baru
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="glass p-6 rounded-2xl flex items-center gap-4 border-l-4 border-brand">
                        <div class="w-12 h-12 rounded-full bg-brand/20 flex items-center justify-center text-brand text-xl">
                            <i class="fas fa-film"></i>
                        </div>
                        <div>
                            <p class="text-gray-400 text-sm">Total Video</p>
                            <h3 class="text-2xl font-bold" id="stat-total">0</h3>
                        </div>
                    </div>
                </div>

                <div class="glass rounded-2xl overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-white/5 text-gray-400 text-sm">
                                    <th class="p-4">Thumbnail</th>
                                    <th class="p-4">Judul & Info</th>
                                    <th class="p-4">Genre</th>
                                    <th class="p-4">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body" class="divide-y divide-white/5"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal -->
    <div id="video-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="app.closeModal('video-modal')"></div>
        <div class="glass w-full max-w-4xl rounded-2xl relative z-10 flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-white/10 flex justify-between items-center">
                <h3 class="text-xl font-bold" id="modal-title">Tambah Video</h3>
                <button onclick="app.closeModal('video-modal')" class="text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-6">
                <form id="video-form" class="space-y-4">
                    <input type="hidden" id="form-id">
                    <div class="space-y-1">
                        <label class="text-sm text-gray-400">Judul Video</label>
                        <input type="text" id="form-title" oninput="app.livePreview()" required class="w-full bg-dark/50 border border-white/10 rounded-lg px-4 py-2.5 focus:border-brand focus:outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-sm text-gray-400">Deskripsi</label>
                        <textarea id="form-desc" rows="3" required class="w-full bg-dark/50 border border-white/10 rounded-lg px-4 py-2.5 focus:border-brand focus:outline-none"></textarea>
                    </div>
                    <div class="space-y-1">
                        <label class="text-sm text-gray-400">URL Thumbnail</label>
                        <input type="url" id="form-thumb" oninput="app.livePreview()" required placeholder="https://..." class="w-full bg-dark/50 border border-white/10 rounded-lg px-4 py-2.5 focus:border-brand focus:outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-sm text-gray-400">URL Google Drive (Link Share)</label>
                        <input type="url" id="form-url" required placeholder="https://drive.google.com/..." class="w-full bg-dark/50 border border-white/10 rounded-lg px-4 py-2.5 focus:border-brand focus:outline-none">
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div><label class="text-xs text-gray-400">Genre</label><input type="text" id="form-genre" required class="w-full bg-dark/50 border border-white/10 rounded-lg p-2 focus:border-brand focus:outline-none"></div>
                        <div><label class="text-xs text-gray-400">Tahun</label><input type="number" id="form-year" required class="w-full bg-dark/50 border border-white/10 rounded-lg p-2 focus:border-brand focus:outline-none"></div>
                        <div><label class="text-xs text-gray-400">Rating</label><input type="number" id="form-rating" step="0.1" required class="w-full bg-dark/50 border border-white/10 rounded-lg p-2 focus:border-brand focus:outline-none"></div>
                    </div>
                </form>
                
                <!-- Real-time Preview Area -->
                <div class="hidden md:block border-l border-white/10 pl-6">
                    <p class="text-xs text-gray-500 mb-4 uppercase font-bold tracking-widest">Live Preview</p>
                    <div class="rounded-xl overflow-hidden bg-dark-card border border-white/5 shadow-2xl">
                        <img id="preview-img" src="https://via.placeholder.com/400x600?text=Preview" class="w-full aspect-[2/3] object-cover">
                        <div class="p-4">
                            <h4 id="preview-title" class="font-bold truncate uppercase tracking-tighter">Judul Video</h4>
                            <p class="text-brand text-xs font-bold mt-1">REAL-TIME EDITING MODE</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-6 border-t border-white/10 flex justify-end gap-3">
                <button onclick="app.closeModal('video-modal')" class="px-4 py-2 text-gray-400">Batal</button>
                <button onclick="app.saveVideo()" id="btn-save" class="bg-brand px-6 py-2 rounded-lg font-bold">Simpan Data</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChJUtOEnYGW9iryHYqst2ql-oNDdJyysw",
            authDomain: "marketplace-ea770.firebaseapp.com",
            projectId: "marketplace-ea770",
            storageBucket: "marketplace-ea770.firebasestorage.app",
            messagingSenderId: "457308432728",
            appId: "1:457308432728:web:01568ae63de26444105d2d"
        };

        const ADMIN_EMAIL = "cristiandwih2006@gmail.com";
        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);
        const provider = new GoogleAuthProvider();

        window.app = {
            user: null,
            isAdmin: false,
            videos: [],
            currentView: 'home',
            heroIndex: 0,
            heroInterval: null,
            
            init() {
                this.setupAuthListener();
                this.setupRealtimeDB();
                this.setupSearch();
            },

            showToast(msg, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `glass border-l-4 ${type === 'error' ? 'border-red-500' : 'border-green-500'} px-5 py-3 rounded-lg shadow-xl toast-enter pointer-events-auto`;
                toast.innerHTML = `<span class="text-sm font-medium">${msg}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            },

            login() { signInWithPopup(auth, provider); },
            logout() { signOut(auth); },

            setupAuthListener() {
                onAuthStateChanged(auth, (user) => {
                    this.user = user;
                    this.isAdmin = user && user.email === ADMIN_EMAIL;
                    this.renderAuthUI();
                });
            },

            renderAuthUI() {
                const desktopAuth = document.getElementById('auth-section');
                const mobileAuthBtn = document.getElementById('mobile-auth-btn');
                const adminMenuDesktop = document.getElementById('admin-menu-section');
                const adminMenuMobile = document.getElementById('mobile-admin-btn');

                if (this.user) {
                    desktopAuth.innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${this.user.photoURL}" class="w-8 h-8 rounded-full border border-brand">
                            <div class="overflow-hidden">
                                <p class="text-xs font-bold truncate w-24">${this.user.displayName}</p>
                                <button onclick="app.logout()" class="text-[10px] text-gray-500 hover:text-white">Keluar</button>
                            </div>
                        </div>
                    `;
                    mobileAuthBtn.innerHTML = `<img src="${this.user.photoURL}" onclick="app.logout()" class="w-8 h-8 rounded-full border border-brand">`;
                } else {
                    desktopAuth.innerHTML = `<button onclick="app.login()" class="w-full bg-white/5 py-3 rounded-xl text-xs font-bold">LOGIN GOOGLE</button>`;
                    mobileAuthBtn.innerHTML = `<button onclick="app.login()" class="bg-brand px-3 py-1.5 rounded-lg text-xs font-bold">LOGIN</button>`;
                }

                if (this.isAdmin) {
                    adminMenuDesktop.classList.remove('hidden');
                    adminMenuMobile.classList.remove('hidden');
                    adminMenuMobile.classList.add('flex');
                } else {
                    adminMenuDesktop.classList.add('hidden');
                    adminMenuMobile.classList.add('hidden');
                }
            },

            navigate(viewId, payload = null) {
                document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                document.getElementById(`view-${viewId}`).classList.remove('hidden');
                this.currentView = viewId;

                if (viewId !== 'detail') document.getElementById('main-player').src = '';
                if (viewId === 'detail' && payload) this.renderDetail(payload);
                window.scrollTo(0,0);
            },

            setupRealtimeDB() {
                const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
                onSnapshot(q, (snapshot) => {
                    this.videos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    this.renderHome();
                    if(this.isAdmin) this.renderAdminTable();
                });
            },

            renderHome(filterText = '') {
                const mainRow = document.getElementById('main-row');
                const heroContainer = document.getElementById('hero-container');
                
                let filtered = this.videos;
                if (filterText) {
                    const txt = filterText.toLowerCase();
                    filtered = this.videos.filter(v => v.title.toLowerCase().includes(txt) || v.genre.toLowerCase().includes(txt));
                }

                if (this.videos.length > 0 && !filterText) {
                    this.startHeroSlider();
                } else if(this.videos.length === 0) {
                    heroContainer.innerHTML = `<div class="h-full flex items-center justify-center text-gray-500">Database Kosong. Tambah melalui Admin.</div>`;
                    mainRow.innerHTML = '';
                }

                mainRow.innerHTML = filtered.map(vid => `
                    <div onclick="app.navigate('detail', '${vid.id}')" class="group cursor-pointer fade-in">
                        <div class="netflix-card netflix-hover aspect-[2/3] bg-dark-card rounded-xl overflow-hidden relative mb-3">
                            <img src="${vid.thumbnail}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <div class="w-12 h-12 bg-brand rounded-full flex items-center justify-center shadow-xl transform scale-75 group-hover:scale-100 transition-transform">
                                    <i class="fas fa-play ml-1"></i>
                                </div>
                            </div>
                        </div>
                        <h3 class="font-bold text-sm line-clamp-1 group-hover:text-brand transition-colors uppercase tracking-tight">${vid.title}</h3>
                        <div class="flex items-center gap-2 mt-1 text-[10px] text-gray-500">
                            <span class="text-brand font-bold">${vid.rating}</span>
                            <span>•</span>
                            <span>${vid.year}</span>
                            <span>•</span>
                            <span class="truncate">${vid.genre}</span>
                        </div>
                    </div>
                `).join('');
            },

            startHeroSlider() {
                if (this.heroInterval) clearInterval(this.heroInterval);
                this.renderHeroSlide();
                this.heroInterval = setInterval(() => {
                    this.heroIndex = (this.heroIndex + 1) % this.videos.length;
                    this.renderHeroSlide();
                }, 8000);
            },

            renderHeroSlide() {
                const hero = this.videos[this.heroIndex];
                if (!hero) return;
                const container = document.getElementById('hero-container');
                container.classList.remove('skeleton');
                container.innerHTML = `
                    <div class="absolute inset-0 bg-cover bg-center transition-all duration-1000 fade-in" style="background-image: url('${hero.thumbnail}')"></div>
                    <div class="absolute inset-0 hero-gradient"></div>
                    <div class="absolute bottom-24 left-5 md:left-10 md:bottom-32 max-w-2xl z-10 fade-in">
                        <span class="px-2 py-1 bg-brand text-white text-[10px] font-bold rounded uppercase mb-4 inline-block">Featured</span>
                        <h1 class="text-4xl md:text-6xl font-black mb-4 uppercase tracking-tighter drop-shadow-2xl">${hero.title}</h1>
                        <p class="text-gray-300 text-sm md:text-base line-clamp-2 mb-6 max-w-lg">${hero.description}</p>
                        <div class="flex gap-4">
                            <button onclick="app.navigate('detail', '${hero.id}')" class="bg-brand text-white px-8 py-3 rounded-full font-bold flex items-center gap-2 shadow-lg shadow-brand/30 hover:scale-105 transition-transform">
                                <i class="fas fa-play"></i> TONTON SEKARANG
                            </button>
                        </div>
                    </div>
                `;
            },

            setupSearch() {
                document.getElementById('search-input').addEventListener('input', (e) => this.renderHome(e.target.value));
            },

            convertDriveLink(url) {
                if (url.includes('drive.google.com/file/d/')) {
                    const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                    if (match && match[1]) return `https://drive.google.com/file/d/${match[1]}/preview`;
                }
                return url;
            },

            renderDetail(id) {
                const video = this.videos.find(v => v.id === id);
                if(!video) return;
                document.getElementById('detail-thumb').src = video.thumbnail;
                document.getElementById('detail-title').innerText = video.title;
                document.getElementById('detail-desc').innerText = video.description;
                document.getElementById('detail-meta').innerHTML = `<span>${video.year}</span> • <span class="text-brand font-bold">${video.rating}</span> • <span>${video.genre}</span>`;
                document.getElementById('main-player').src = this.convertDriveLink(video.videoUrl);
            },

            renderAdminTable() {
                const tbody = document.getElementById('admin-table-body');
                document.getElementById('stat-total').innerText = this.videos.length;
                tbody.innerHTML = this.videos.map(vid => `
                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="p-4 w-24"><img src="${vid.thumbnail}" class="w-16 h-20 object-cover rounded"></td>
                        <td class="p-4">
                            <p class="font-bold text-sm">${vid.title}</p>
                            <p class="text-xs text-gray-500">${vid.year} • Rating: ${vid.rating}</p>
                        </td>
                        <td class="p-4 text-xs">${vid.genre}</td>
                        <td class="p-4">
                            <div class="flex gap-2">
                                <button onclick="app.editVideo('${vid.id}')" class="p-2 bg-blue-500/20 text-blue-500 rounded"><i class="fas fa-edit"></i></button>
                                <button onclick="app.deleteVideo('${vid.id}')" class="p-2 bg-red-500/20 text-red-500 rounded"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            },

            livePreview() {
                const title = document.getElementById('form-title').value;
                const thumb = document.getElementById('form-thumb').value;
                document.getElementById('preview-title').innerText = title || "Judul Video";
                if(thumb) document.getElementById('preview-img').src = thumb;
            },

            openModal(id) {
                document.getElementById(id).classList.remove('hidden');
                if(id === 'video-modal') {
                    document.getElementById('video-form').reset();
                    document.getElementById('form-id').value = '';
                    document.getElementById('modal-title').innerText = 'Tambah Video';
                    this.livePreview();
                }
            },

            closeModal(id) { document.getElementById(id).classList.add('hidden'); },

            editVideo(id) {
                const v = this.videos.find(v => v.id === id);
                document.getElementById('form-id').value = v.id;
                document.getElementById('form-title').value = v.title;
                document.getElementById('form-desc').value = v.description;
                document.getElementById('form-thumb').value = v.thumbnail;
                document.getElementById('form-url').value = v.videoUrl;
                document.getElementById('form-genre').value = v.genre;
                document.getElementById('form-year').value = v.year;
                document.getElementById('form-rating').value = v.rating;
                this.openModal('video-modal');
                this.livePreview();
            },

            async saveVideo() {
                const id = document.getElementById('form-id').value;
                const data = {
                    title: document.getElementById('form-title').value,
                    description: document.getElementById('form-desc').value,
                    thumbnail: document.getElementById('form-thumb').value,
                    videoUrl: document.getElementById('form-url').value,
                    genre: document.getElementById('form-genre').value,
                    year: parseInt(document.getElementById('form-year').value),
                    rating: parseFloat(document.getElementById('form-rating').value),
                    createdAt: id ? this.videos.find(v=>v.id===id).createdAt : Date.now()
                };

                try {
                    if (id) await updateDoc(doc(db, "videos", id), data);
                    else await addDoc(collection(db, "videos"), data);
                    this.showToast('Data Berhasil Disinkronkan!', 'success');
                    this.closeModal('video-modal');
                } catch (e) { this.showToast('Gagal menyimpan', 'error'); }
            },

            async deleteVideo(id) {
                if(confirm("Hapus video ini secara permanen dari database?")) {
                    await deleteDoc(doc(db, "videos", id));
                    this.showToast('Data Terhapus');
                }
            }
        };

        app.init();
    </script>
</body>
            </html>
